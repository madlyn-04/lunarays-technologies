<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex, follow">
  <title>Page not found | Lunarays Technologies</title>
  <link rel="icon" type="image/png" href="logos/logo-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Plus+Jakarta+Sans:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--navy:#101a33;--blue:#61d9e9;--red:#c62828;--muted:#64748b;--paper:#f8fafc}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 100%,#e8f2ff 0,transparent 48%),var(--paper);color:var(--navy);font-family:Lato,Arial,sans-serif}
    .page{min-height:100vh;max-width:1200px;margin:auto;padding:30px clamp(24px,6vw,80px);display:flex;flex-direction:column}
    header{display:flex;align-items:center;min-height:52px}
    header img{width:184px;height:auto;object-fit:contain}
    main{flex:1;display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);align-items:center;gap:clamp(24px,6vw,84px);padding:45px 0 70px}
    .art{width:min(100%,440px);justify-self:center;filter:drop-shadow(0 22px 25px rgba(16,26,51,.10))}
    .copy{max-width:470px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--red);font:700 13px 'Plus Jakarta Sans',sans-serif;letter-spacing:.12em;text-transform:uppercase}
    .eyebrow:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--red)}
    h1{margin:18px 0 4px;font:700 clamp(104px,16vw,172px)/.85 'Space Grotesk',sans-serif;letter-spacing:-.09em;color:var(--navy)}
    h2{margin:24px 0 12px;font:700 clamp(26px,3.5vw,38px)/1.15 'Space Grotesk',sans-serif;letter-spacing:-.035em}
    p{margin:0;color:var(--muted);font-size:17px;line-height:1.7}
    .actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:30px}
    .home{display:inline-flex;min-height:50px;align-items:center;justify-content:center;gap:10px;padding:0 22px;border-radius:8px;background:var(--red);color:#fff;text-decoration:none;font:700 14px 'Plus Jakarta Sans',sans-serif;box-shadow:0 8px 18px rgba(198,40,40,.18);transition:background .2s,transform .2s}
    .home:hover{background:#a91f1f;transform:translateY(-2px)}
    .home:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
    .back{color:var(--navy);font:600 14px 'Plus Jakarta Sans',sans-serif;text-decoration:underline;text-underline-offset:4px}
    footer{padding-top:18px;border-top:1px solid #e2e8f0;color:#94a3b8;font-size:13px}
    @media(max-width:720px){.page{padding-top:22px}header img{width:158px}main{grid-template-columns:1fr;gap:6px;padding:34px 0 48px;text-align:center}.art{width:min(76vw,300px)}.copy{margin:0 auto}.eyebrow{font-size:11px}h1{font-size:clamp(100px,30vw,142px);margin-top:15px}h2{margin-top:18px}.actions{justify-content:center;margin-top:24px}.back{font-size:13px}footer{text-align:center}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="page">
    <header><a href="/" aria-label="Lunarays Technologies home"><img src="logos/logo-transparent.png" alt="Lunarays Technologies"></a></header>
    <main>
      <svg class="art" viewBox="0 0 440 430" role="img" aria-labelledby="robot-title robot-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="robot-title">A Lunarays robot looking for the missing page</title>
        <desc id="robot-desc">A friendly white and navy robot with glowing cyan eyes and a small Oops message.</desc>
        <path d="M91 374c14-30 19-39 43-50 16-8 22 8 14 20-10 16-18 24-25 42-7 17-20 26-34 22-16-5-14-20 2-34Z" fill="#b9d3df" opacity=".8"/>
        <path d="M129 327c-21 8-35 24-47 50m69-47c-11 12-18 25-21 40" fill="none" stroke="#a8c4d1" stroke-width="9" stroke-linecap="round"/>
        <path d="m135 186-42 14 20 75 40-7m144-77 42 15-19 74-39-7" fill="none" stroke="#253250" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M130 190c14-35 45-54 91-54 48 0 79 20 92 57l-13 117c-3 30-26 52-56 52h-52c-31 0-54-22-57-52l-5-120Z" fill="#e5e7eb" stroke="#c7cbd3" stroke-width="5"/>
        <path d="M169 220c16-13 36-19 58-17 21 2 43 10 57 24" fill="none" stroke="#27314a" stroke-width="4" stroke-linecap="round"/>
        <path d="M200 159c-19-11-29-26-31-45" fill="none" stroke="#65728d" stroke-width="11" stroke-linecap="round"/>
        <circle cx="166" cy="107" r="8" fill="#61d9e9"/>
        <circle cx="221" cy="91" r="67" fill="#e9eaee" stroke="#c7cbd3" stroke-width="6"/>
        <path d="M168 93c12-30 33-46 59-46 33 0 56 23 59 56 3 32-19 55-54 58-37 3-68-22-68-55 0-5 1-9 4-13Z" fill="#202b45"/>
        <path d="M188 88v39m-19-19h38M237 106v39m-19-19h38" stroke="#61d9e9" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 8"/>
        <path d="M168 65c21-27 55-34 81-20" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".8"/>
        <path d="m111 264-9 48 25 5 12-47m185-1 10 48-25 5-12-47" fill="#e5e7eb" stroke="#c7cbd3" stroke-width="4" stroke-linejoin="round"/>
        <path d="m163 340-16 43 45 9 20-42m69-10 19 43-44 9-21-42" fill="#d7d9df" stroke="#c7cbd3" stroke-width="4" stroke-linejoin="round"/>
        <path d="M292 59h123v54h-123l-17-27 17-27Z" fill="#202b45"/>
        <text x="350" y="94" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2">OOPS...</text>
        <path d="M292 113 268 133" fill="none" stroke="#aab3c2" stroke-width="4"/>
      </svg>
      <section class="copy" aria-labelledby="error-title">
        <span class="eyebrow">Page not found</span>
        <h1>404</h1>
        <h2 id="error-title">Oops! We lost this page.</h2>
        <p>The link may be outdated, or the page may have moved. Let’s get you back to where you need to be.</p>
        <div class="actions">
          <a class="home" href="/">Go to homepage <span aria-hidden="true">→</span></a>
          <a class="back" href="javascript:history.back()">Go back</a>
        </div>
      </section>
    </main>
    <footer>© <span id="year">2026</span> Lunarays Technologies</footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
